<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Grandmaster’s Gauntlet</title>
<style>
:root{--bg:#f2f3f7;--fg:#1b1f2a;--mut:#5d6578;--card:#fff;--line:#d5d9e4;--accent:#3d7bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1116;--fg:#e8eaf0;--mut:#8b93a5;--card:#161b26;--line:#252c3b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1116;--fg:#e8eaf0;--mut:#8b93a5;--card:#161b26;--line:#252c3b;color-scheme:dark}
body{margin:0;padding:18px 12px 28px;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,sans-serif;text-align:center}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px}
h1 span{color:var(--accent)}
.sub{margin:0 0 8px;color:var(--mut);font-size:13px}
canvas{display:block;margin:10px auto;max-width:100%;height:auto;border-radius:12px;background:#10141c;border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.panel{max-width:720px;margin:10px auto;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px}
button{font:inherit;font-size:14px;font-weight:600;padding:7px 14px;margin:3px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#feed{text-align:left;font-size:13px;line-height:1.55;min-height:150px}
#feed div{padding:1px 0;border-bottom:1px solid var(--line)}
#feed .t{color:var(--mut);font-variant-numeric:tabular-nums;margin-right:8px}
#feed .wave{font-weight:700}
#feed .boss{color:#c07bff;font-weight:700}
#feed .upg{color:#2fa56a;font-weight:600}
#feed .bad{color:#e0524a}
#rec{color:var(--mut);font-size:13px;margin:6px 12px}
</style></head><body>
<h1>The Grandmaster’s <span>Gauntlet</span></h1>
<p class="sub">A game you watch. The Grandmaster fights wave after wave on his own and drafts his own upgrades between waves.</p>
<canvas id="c" width="1000" height="1000"></canvas>
<div class="panel" id="bar"><button data-s="0">Pause</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button><button data-s="8">8×</button></div>
<div class="panel"><div id="feed"></div></div>
<p id="rec"></p>
<script>
// ======== Settings ========
const W=1000,CX=500,CY=500,RO=485,BALL=380;
const c=document.getElementById('c'),g=c.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];

// Enemy types: each one fights in its own way
const TYPES={
  grunt:  {hp:3, r:14,speed:210,cost:1,unlock:1,col:'#6aa8ff',name:'grunt'},    // keeps its distance, dodges, throws steadily
  swarmer:{hp:1, r:9, speed:300,cost:1,unlock:2,col:'#ffa24d',name:'swarmer'},  // rushes in and explodes on contact
  sniper: {hp:2, r:12,speed:130,cost:3,unlock:3,col:'#4de0c8',name:'sniper'},   // locks on with a red line, then fires a very fast ball
  tank:   {hp:12,r:22,speed:90, cost:4,unlock:4,col:'#8c9ad6',name:'tank'},     // slow, tough, big heavy balls
  warden: {hp:30,r:30,speed:70, cost:0,unlock:99,col:'#c07bff',name:'Warden'}   // boss every 5th wave: ring bursts + calls swarmers
};
const UPG=[
  {name:'Rapid Fire',  desc:'+25% attack rate',      apply:()=>gm.rate*=1.25,                 w:()=>2},
  {name:'Swift Feet',  desc:'+8% speed',             apply:()=>gm.speed*=1.08,                w:()=>2},
  {name:'Thick Skin',  desc:'+3 max health',         apply:()=>{gm.maxHp+=3;gm.hp+=3},        w:()=>gm.hp<gm.maxHp*0.55?5:1.5},
  {name:'Vampire',     desc:'kills heal more',       apply:()=>gm.killHeal+=0.12,             w:()=>gm.hp<gm.maxHp*0.55?3:1},
  {name:'Small Target',desc:'smaller hitbox',        apply:()=>gm.r=Math.max(6,gm.r-1),       w:()=>gm.r>6?2:0},
  {name:'Piercing',    desc:'balls pass through 1 more enemy',apply:()=>gm.pierce+=1,         w:()=>2.5},
  {name:'Fast Balls',  desc:'+15% ball speed',       apply:()=>gm.ballSpeed*=1.15,            w:()=>1.5}
];

// ======== State ========
let gm,foes,balls,ghosts,fx,queue,wave,state,timer,spawnT,time=0,run=0,best=0,kills,killsBy,dmgTaken,waveDmg,waveT,banner=0,speedMul=1;
let draft=null,draftDone=false,pickIdx=-1,feed=[],lastHurtLog=-9,lastLockLog=-9;
try{best=+localStorage.getItem('gauntletBest')||0}catch(e){}

function log(msg,kind){
  const m=Math.floor(time/60),s=Math.floor(time%60);
  feed.unshift('<div class="'+(kind||'')+'"><span class="t">'+m+':'+String(s).padStart(2,'0')+'</span>'+msg+'</div>');
  feed.length=Math.min(feed.length,9);
  document.getElementById('feed').innerHTML=feed.join('');
}
function newRun(){
  run++;time=0;
  gm={x:CX,y:CY,vx:0,vy:0,r:10,hp:12,maxHp:12,speed:460,rate:7,ballSpeed:BALL,pierce:0,killHeal:0.06,cd:1,alive:true,flash:0,target:null,gx:CX,gy:CY,sw:0,upg:[]};
  foes=[];balls=[];ghosts=[];fx=[];kills=0;killsBy={};dmgTaken=0;wave=0;feed=[];
  log('A new run begins. Good luck, Grandmaster.','wave');
  startWave();
}
function buildWave(n){
  const q=[];if(n%5==0)q.push('warden');
  let budget=4+4*n+0.4*n*n;/* later waves get bigger faster */const pool=Object.keys(TYPES).filter(k=>k!='warden'&&TYPES[k].unlock<=n);
  while(budget>=1){const k=pick(pool);if(TYPES[k].cost>budget)continue;q.push(k);budget-=TYPES[k].cost}
  for(let i=q.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[q[i],q[j]]=[q[j],q[i]]}
  return q;
}
function startWave(){
  wave++;queue=buildWave(wave);state='wave';spawnT=0;waveDmg=0;waveT=0;banner=2.5;
  const cnt={};for(const k of queue)cnt[k]=(cnt[k]||0)+1;
  log('Wave '+wave+': '+Object.keys(cnt).map(k=>cnt[k]+' '+TYPES[k].name+(cnt[k]>1&&k!='warden'?'s':'')).join(', '),'wave');
}
function spawn(type,x,y){
  const T=TYPES[type],a=Math.random()*6.283;
  let hp=T.hp+(type=='grunt'||type=='tank'?Math.floor(wave/6):0)+(type=='warden'?6*Math.floor(wave/5):0);
  foes.push({type,x:x??CX+Math.cos(a)*(RO-40),y:y??CY+Math.sin(a)*(RO-40),vx:0,vy:0,r:T.r,hp,maxHp:hp,speed:T.speed*(1+0.015*wave),cd:rnd(0.5,1.5),flash:0,alive:true,gx:CX,gy:CY,charge:0,aim:null,seed:Math.random()*9,t:0,sum:6,dir:Math.random()<.5?1:-1});
}

// ======== Shooting ========
function fire(src,tx,ty,o){
  o=o||{};const sp=o.speed||BALL,dx=tx-src.x,dy=ty-src.y,d=Math.hypot(dx,dy)||1;
  balls.push({x:src.x,y:src.y,px:src.x,py:src.y,vx:dx/d*sp,vy:dy/d*sp,team:src===gm?1:0,r:o.r||7,dmg:o.dmg||1,pierce:o.pierce||0,hit:null,fast:!!o.fast,delay:0});
}
function lead(src,t,sp){let px=t.x,py=t.y;for(let i=0;i<3;i++){const T=Math.min(0.5,Math.hypot(px-src.x,py-src.y)/sp);px=t.x+t.vx*T;py=t.y+t.vy*T}return[px,py]}

// ======== Dodging brain (used by the Grandmaster and, more simply, by grunts) ========
const DIRS=[[0,0]];for(let i=0;i<16;i++){const a=i*Math.PI/8;DIRS.push([Math.cos(a),Math.sin(a)])}
function planMove(u,two,goalW){
  const foe=balls.concat(ghosts).filter(b=>b.team!=(u===gm?1:0)),n=foe.length,cmin=new Float32Array(n),sp=u.speed,T=two?1.5:1;
  const D2=two?DIRS:[DIRS[0]];
  let best=DIRS[0],bs=-1e9;
  for(const d1 of DIRS)for(const d2 of D2){
    let x=u.x,y=u.y;cmin.fill(999);
    for(let t=0.05;t<=T;t+=0.05){
      const d=(!two||t<=0.4)?d1:d2;
      let nx=x+d[0]*sp*0.05,ny=y+d[1]*sp*0.05;
      const dd=Math.hypot(nx-CX,ny-CY),mx=RO-u.r-4;
      if(dd>mx){nx=CX+(nx-CX)/dd*mx;ny=CY+(ny-CY)/dd*mx}
      x=nx;y=ny;
      for(let k=0;k<n;k++){const b=foe[k],tt=Math.max(0,t-(b.delay||0)),ex=b.x+b.vx*tt-x,ey=b.y+b.vy*tt-y,cl=Math.sqrt(ex*ex+ey*ey)-(u.r+b.r);if(cl<cmin[k])cmin[k]=cl}
    }
    // count how many (and how heavy) balls this plan lets hit him; fewer is always better
    let hits=0,deep=0,mc=999;
    for(let k=0;k<n;k++){const cl=cmin[k];if(cl<0){hits+=foe[k].dmg||1;deep-=cl}if(cl<mc)mc=cl}
    const gap=RO-u.r-Math.hypot(x-CX,y-CY),wp=gap<100?(100-gap)*1.2:0;
    const s=-hits*1000-deep*5+(mc>8?500:0)+Math.min(mc,20)*8-wp-goalW*Math.hypot(x-u.gx,y-u.gy);
    if(s>bs){bs=s;best=d1}
  }
  return best;
}
// The Grandmaster's trick: throw at a dangerous incoming ball so both pop
function swat(){
  let best=null,bt=9;
  for(const b of balls){
    if(b.team!=0||b.fast)continue;
    const v2=b.vx*b.vx+b.vy*b.vy,tc=((gm.x-b.x)*b.vx+(gm.y-b.y)*b.vy)/v2;
    if(tc<0.1||tc>0.7)continue;
    if(Math.hypot(b.x+b.vx*tc-gm.x,b.y+b.vy*tc-gm.y)>gm.r+b.r+12)continue;
    if(tc<bt){bt=tc;best=b}
  }
  if(!best)return false;
  const sp=Math.hypot(best.vx,best.vy);
  for(let t=0.05;t<=0.7;t+=0.02){
    const px=best.x+best.vx*t,py=best.y+best.vy*t;
    if(Math.hypot(px-gm.x,py-gm.y)<=gm.ballSpeed*t){fire(gm,gm.x+(px-gm.x)*1.4,gm.y+(py-gm.y)*1.4,{speed:gm.ballSpeed,pierce:gm.pierce});gm.cd=1/gm.rate;return true}
  }
  return false;
}
function gmThink(dt){
  // pick the most urgent enemy: close, weak, or dangerous (swarmers and snipers first)
  let best=null,bs=1e9;
  for(const f of foes){
    if(!f.alive)continue;
    const d=Math.hypot(f.x-gm.x,f.y-gm.y);
    let s=d+f.hp*35-(f===gm.target?60:0);
    if(f.type=='swarmer'&&d<450)s-=180;
    if(f.type=='sniper')s-=100;
    if(s<bs){bs=s;best=f}
  }
  gm.target=best;
  if(best){
    const dx=gm.x-best.x,dy=gm.y-best.y,d=Math.hypot(dx,dy)||1;
    const D=best.type=='swarmer'?320:best.type=='sniper'?260:best.type=='tank'?300:200;
    gm.gx=best.x+dx/d*D;gm.gy=best.y+dy/d*D;
    const hd=Math.hypot(gm.gx-CX,gm.gy-CY),hm=RO*0.7;
    if(hd>hm){gm.gx=CX+(gm.gx-CX)/hd*hm;gm.gy=CY+(gm.gy-CY)/hd*hm}
  }else{gm.gx=CX;gm.gy=CY}
  const mv=planMove(gm,true,0.2);
  gm.vx=mv[0]*gm.speed;gm.vy=mv[1]*gm.speed;
  gm.x+=gm.vx*dt;gm.y+=gm.vy*dt;
  const dd=Math.hypot(gm.x-CX,gm.y-CY),mx=RO-gm.r-4;if(dd>mx){gm.x=CX+(gm.x-CX)/dd*mx;gm.y=CY+(gm.y-CY)/dd*mx}
  gm.cd-=dt;gm.flash=Math.max(0,gm.flash-dt);
  if(gm.cd<=0&&!swat()&&best){
    const[p,q]=lead(gm,best,gm.ballSpeed),a=Math.atan2(q-gm.y,p-gm.x),off=((gm.sw++%3)-1)*40;
    fire(gm,p-Math.sin(a)*off,q+Math.cos(a)*off,{speed:gm.ballSpeed,pierce:gm.pierce});gm.cd=1/gm.rate;
  }
}

// ======== Enemy behaviour ========
function enemyThink(u,dt){
  const dx=gm.x-u.x,dy=gm.y-u.y,d=Math.hypot(dx,dy)||1;
  let mv=[0,0];u.cd-=dt*(1+Math.max(0,waveT-60)/45);u.flash=Math.max(0,u.flash-dt); // after 60s in one wave, enemies get more and more desperate (they shoot faster and faster)
  const E=1+0.04*wave; // enemy balls get faster every wave
  if(u.type=='grunt'){
    u.gx=gm.x-dx/d*300;u.gy=gm.y-dy/d*300;
    // grunts are not perfect dodgers: every 0.3s they either dodge (more often in later waves) or just keep walking to their spot
    u.react=(u.react||0)-dt;
    if(u.react<=0){
      u.react=0.3;
      if(Math.random()<Math.min(0.6,0.3+0.025*wave))u.mv=planMove(u,false,0.12);
      else{const ax=u.gx-u.x,ay=u.gy-u.y,ad=Math.hypot(ax,ay);u.mv=ad>20?[ax/ad,ay/ad]:[0,0]}
    }
    mv=u.mv||[0,0];
    if(u.cd<=0&&d<700){const[p,q]=lead(u,gm,BALL*E);fire(u,p+rnd(-25,25),q+rnd(-25,25),{speed:BALL*E});u.cd=rnd(1.1,1.6)/(1+0.03*wave)}
  }else if(u.type=='swarmer'){
    const w=Math.sin(time*4+u.seed)*0.6;mv=[dx/d-dy/d*w,dy/d+dx/d*w];const m=Math.hypot(mv[0],mv[1])||1;mv=[mv[0]/m,mv[1]/m];
  }else if(u.type=='tank'){
    mv=d>340?[dx/d,dy/d]:[0,0];
    if(u.cd<=0&&d<750){const[p,q]=lead(u,gm,260*E);fire(u,p,q,{speed:260*E,r:11,dmg:2});u.cd=1.9/(1+0.03*wave)}
  }else if(u.type=='sniper'){
    if(u.charge>0){
      u.charge-=dt;
      if(u.charge<=0){fire(u,u.aim[0],u.aim[1],{speed:950,r:6,dmg:2,fast:true});u.cd=2.6/(1+0.03*wave);u.aim=null}
    }else{
      mv=d<430?[-dx/d,-dy/d]:[-dy/d*u.dir,dx/d*u.dir];
      if(u.cd<=0&&d<900){u.aim=lead(u,gm,950);u.charge=0.7;if(time-lastLockLog>3){lastLockLog=time;log('A sniper locks on!')}}
    }
  }else if(u.type=='warden'){
    u.t+=dt;mv=d>380?[dx/d,dy/d]:[0,0];
    if(u.cd<=0){for(let i=0;i<14;i++){const a=u.t+i*6.283/14;fire(u,u.x+Math.cos(a)*100,u.y+Math.sin(a)*100,{speed:230*E,r:6})}u.cd=2.4}
    u.sum-=dt;if(u.sum<=0){u.sum=9;for(let i=0;i<3;i++)spawn('swarmer',u.x+rnd(-30,30),u.y+rnd(-30,30));log('The Warden calls swarmers!','boss')}
  }
  u.vx=mv[0]*u.speed;u.vy=mv[1]*u.speed;
  u.x+=u.vx*dt;u.y+=u.vy*dt;
  const dd=Math.hypot(u.x-CX,u.y-CY),mx=RO-u.r-4;if(dd>mx){u.x=CX+(u.x-CX)/dd*mx;u.y=CY+(u.y-CY)/dd*mx}
}

// ======== Damage and deaths ========
function hurtGM(n){
  gm.hp-=n;gm.flash=0.25;dmgTaken+=n;waveDmg+=n;
  if(time-lastHurtLog>0.8&&gm.hp>0){lastHurtLog=time;log('The Grandmaster is hit. HP '+Math.max(0,Math.ceil(gm.hp))+'/'+gm.maxHp,'bad')}
  if(gm.hp<=0&&gm.alive){
    gm.alive=false;state='dead';timer=0;
    if(wave>best){best=wave;try{localStorage.setItem('gauntletBest',best)}catch(e){}}
    log('The Grandmaster falls on wave '+wave+' after '+kills+' kills.','bad');
  }
}
function killFoe(f){
  f.alive=false;kills++;killsBy[f.type]=(killsBy[f.type]||0)+1;
  gm.hp=Math.min(gm.maxHp,gm.hp+gm.killHeal);
  fx.push({x:f.x,y:f.y,t:0,col:TYPES[f.type].col,big:f.r});
  if(f.type=='warden')log('The Warden has fallen!','boss');
}

// ======== Update ========
function update(dt){
  time+=dt;banner=Math.max(0,banner-dt);
  for(const p of fx)p.t+=dt;fx=fx.filter(p=>p.t<0.45);
  if(state=='dead'){timer+=dt;if(timer>5)newRun();return}
  if(state=='break'){
    timer+=dt;
    if(!draftDone&&timer>1.2){const o=draft;const tot=o.reduce((a,u)=>a+u.w(),0);let r=Math.random()*tot,ch=o[0];for(const u of o){r-=u.w();if(r<=0){ch=u;break}}pickIdx=o.indexOf(ch);ch.apply();gm.upg.push(ch.name);draftDone=true;log('The Grandmaster picks '+ch.name+' ('+ch.desc+')','upg')}
    if(timer>3.4)startWave();
    return;
  }
  // ---- fighting ----
  waveT+=dt;spawnT-=dt;
  if(waveT>60&&waveT-dt<=60)log('The enemy grows desperate and shoots faster!','boss');
  if(queue.length&&spawnT<=0){spawn(queue.pop());spawnT=0.12}
  ghosts=foes.filter(f=>f.alive&&f.type=='sniper'&&f.charge>0&&f.aim).map(f=>{const dx=f.aim[0]-f.x,dy=f.aim[1]-f.y,d=Math.hypot(dx,dy)||1;return{x:f.x,y:f.y,vx:dx/d*950,vy:dy/d*950,r:6,dmg:2,team:0,delay:f.charge}});
  for(const f of foes)if(f.alive)enemyThink(f,dt);
  gmThink(dt);
  for(const b of balls){b.px=b.x;b.py=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt}
  // opposing balls pop each other
  for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
    const a=balls[i],b=balls[j];if(a.team==b.team||a.dead||b.dead)continue;
    if(Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r+4){a.dead=b.dead=true;fx.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2,t:0.25,col:'#ffffff',big:6})}
  }
  for(const b of balls){
    if(b.dead)continue;
    if(Math.hypot(b.x-CX,b.y-CY)>RO+30){b.dead=true;continue}
    if(b.team==0){
      if(sd(b.px,b.py,b.x,b.y,gm.x,gm.y)<gm.r+b.r){b.dead=true;hurtGM(b.dmg)}
    }else{
      for(const f of foes){
        if(!f.alive||(b.hit&&b.hit.has(f)))continue;
        if(sd(b.px,b.py,b.x,b.y,f.x,f.y)<f.r+b.r){
          f.hp--;f.flash=0.2;if(f.hp<=0)killFoe(f);
          if(b.pierce>0){b.pierce--;(b.hit=b.hit||new Set()).add(f)}else{b.dead=true;break}
        }
      }
    }
  }
  balls=balls.filter(b=>!b.dead);
  // swarmers explode on contact
  for(const f of foes)if(f.alive&&f.type=='swarmer'&&Math.hypot(f.x-gm.x,f.y-gm.y)<f.r+gm.r){f.alive=false;fx.push({x:f.x,y:f.y,t:0,col:'#ffa24d',big:22});hurtGM(1)}
  foes=foes.filter(f=>f.alive||f.flash>0);
  if(state=='wave'&&!queue.length&&!foes.some(f=>f.alive)){
    log('Wave '+wave+' cleared in '+Math.round(waveT)+'s - '+(waveDmg?waveDmg+' damage taken':'flawless!'),'wave');
    gm.hp=Math.min(gm.maxHp,gm.hp+gm.maxHp*0.3);
    state='break';timer=0;balls=[];ghosts=[];draftDone=false;pickIdx=-1;
    draft=[...UPG].sort(()=>Math.random()-.5).slice(0,3);
  }
}
function sd(ax,ay,bx,by,px,py){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/l2));return Math.hypot(ax+dx*t-px,ay+dy*t-py)}

// ======== Drawing ========
function dot(u,col,ring){
  g.shadowBlur=14;g.shadowColor=col;g.fillStyle=u.flash>0?'#fff':col;g.beginPath();g.arc(u.x,u.y,u.r,0,7);g.fill();g.shadowBlur=0;
  if(ring){g.strokeStyle=ring;g.lineWidth=3;g.stroke()}
  if(u.hp<u.maxHp||u.type=='warden'){g.fillStyle='#444';g.fillRect(u.x-u.r,u.y-u.r-9,u.r*2,4);g.fillStyle='#6bff9a';g.fillRect(u.x-u.r,u.y-u.r-9,u.r*2*Math.max(0,u.hp)/u.maxHp,4)}
}
function draw(){
  g.clearRect(0,0,W,W);
  const gr=g.createRadialGradient(CX,CY,60,CX,CY,RO);gr.addColorStop(0,'#1f283a');gr.addColorStop(1,'#111723');
  g.fillStyle=gr;g.beginPath();g.arc(CX,CY,RO,0,7);g.fill();
  g.strokeStyle='#ffffff40';g.lineWidth=2;g.beginPath();g.arc(CX,CY,RO,0,7);g.stroke();
  for(const f of foes){ // sniper warning lines
    if(f.alive&&f.charge>0&&f.aim){
      const dx=f.aim[0]-f.x,dy=f.aim[1]-f.y,d=Math.hypot(dx,dy)||1;
      g.strokeStyle='rgba(255,70,70,'+(0.9-f.charge)+')';g.lineWidth=2;g.setLineDash([5,7]);g.beginPath();g.moveTo(f.x,f.y);g.lineTo(f.x+dx/d*1300,f.y+dy/d*1300);g.stroke();g.setLineDash([]);
    }
  }
  for(const p of fx){g.strokeStyle=p.col;g.globalAlpha=Math.max(0,1-p.t/0.45);g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,6+p.big*1.4*p.t/0.45,0,7);g.stroke();g.globalAlpha=1}
  for(const b of balls){
    if(b.fast){g.strokeStyle='#ff4040';g.lineWidth=3;g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x-b.vx*0.03,b.y-b.vy*0.03);g.stroke()}
    g.fillStyle=b.team==1?'#ffd9a0':b.dmg>1?'#ff5a52':'#9ec9ff';g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill();
  }
  for(const f of foes)if(f.alive)dot(f,TYPES[f.type].col);
  if(gm.alive){dot({x:gm.x,y:gm.y,r:gm.r,hp:gm.hp,maxHp:gm.maxHp,flash:gm.flash},'#ff3b3b','#ffd24d')}
  // top bar
  const left=foes.filter(f=>f.alive).length+(queue?queue.length:0);
  g.font='600 16px -apple-system,system-ui,sans-serif';g.textAlign='left';g.fillStyle='#ffffffee';g.fillText('WAVE '+wave,18,28);
  g.font='13px -apple-system,system-ui,sans-serif';g.fillStyle='#ffffffaa';g.fillText(left+' enemies left  \u2022  '+kills+' kills',18,48);
  g.textAlign='right';g.font='600 14px -apple-system,system-ui,sans-serif';g.fillStyle='#ff8a80';g.fillText('GRANDMASTER  '+Math.max(0,Math.ceil(gm.hp))+'/'+gm.maxHp,W-18,28);
  g.fillStyle='#ffffff22';g.fillRect(W-18-170,36,170,7);g.fillStyle='#ff5a52';g.fillRect(W-18-170,36,170*Math.max(0,gm.hp)/gm.maxHp,7);
  g.textAlign='left';g.font='12px -apple-system,system-ui,sans-serif';g.fillStyle='#ffffff99';
  if(gm.upg.length)g.fillText('Upgrades: '+gm.upg.join(', '),18,W-16);
  if(banner>0&&state=='wave'){g.globalAlpha=Math.min(1,banner);g.textAlign='center';g.font='bold 54px -apple-system,system-ui,sans-serif';g.fillStyle='#fff';g.fillText(wave%5==0?'WAVE '+wave+' - BOSS':'WAVE '+wave,CX,CY-160);g.globalAlpha=1}
  if(state=='break'&&draft){
    g.fillStyle='#0009';g.fillRect(0,0,W,W);g.textAlign='center';g.fillStyle='#fff';g.font='bold 30px -apple-system,system-ui,sans-serif';g.fillText('Wave '+wave+' cleared',CX,CY-150);
    g.font='15px -apple-system,system-ui,sans-serif';g.fillStyle='#ffffffbb';g.fillText('The Grandmaster chooses an upgrade...',CX,CY-120);
    draft.forEach((u,i)=>{
      const x=CX-345+i*235,y=CY-90,on=i==pickIdx;
      g.fillStyle=on?'#2fa56a':'#1c2333';g.fillRect(x,y,220,130);g.strokeStyle=on?'#6bff9a':'#ffffff33';g.lineWidth=2;g.strokeRect(x,y,220,130);
      g.fillStyle='#fff';g.font='bold 18px -apple-system,system-ui,sans-serif';g.fillText(u.name,x+110,y+55);
      g.font='13px -apple-system,system-ui,sans-serif';g.fillStyle='#ffffffcc';g.fillText(u.desc,x+110,y+85);
    });
  }
  if(state=='dead'){
    g.fillStyle='#000b';g.fillRect(0,0,W,W);g.textAlign='center';g.fillStyle='#fff';g.font='bold 40px -apple-system,system-ui,sans-serif';g.fillText('The Grandmaster has fallen',CX,CY-20);
    g.font='18px -apple-system,system-ui,sans-serif';g.fillText('Wave '+wave+'  \u2022  '+kills+' kills  \u2022  a new run starts soon',CX,CY+20);
  }
  document.getElementById('rec').textContent='Run '+run+'  \u2022  Best wave: '+best+'  \u2022  Kills this run: '+kills+'  \u2022  Damage taken: '+dmgTaken;
}

// ======== Loop and controls ========
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  for(let i=0;i<speedMul;i++)update(dt);
  draw();requestAnimationFrame(frame);
}
document.getElementById('bar').addEventListener('click',e=>{
  const s=e.target.dataset&&e.target.dataset.s;if(s===undefined)return;
  speedMul=+s;for(const b of e.currentTarget.children)b.className=b.dataset.s===s?'on':'';
});
newRun();requestAnimationFrame(frame);
</script></body></html>
